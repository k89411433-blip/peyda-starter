services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pida
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pida_dev_only}
      POSTGRES_DB: pida
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pida_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pida -d pida"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-pida_redis_dev_only}"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["pida_redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-pida_redis_dev_only}' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pida_pgdata:
  pida_redisdata:
